# Nombre de la app y puerto
spring.application.name=citasmedicas
server.port=8080

# Configuracion de la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:sursalud
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita la consola web de H2 para ver los datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA crea las tablas automaticamente al arrancar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html